# M37a G4: case-011 — live streaming agent turn across a REAL pty (46x24).
#
# The host (host-011.ts, scene "011") feeds a scripted deterministic event
# stream through the REAL app pipeline (TuiApp + ScrollbackEngine + renderer),
# one frame per event, 800ms sleeps between frames. The turn keeps the 30fps
# anim pump running (frames 3-5) — the host's clock is FROZEN, so the pump's
# repaints are IDENTICAL frames → flush("") → zero-byte idle holds mid-stream.
#
# Zero-byte idle is proven by `assert-byte-budget` (writes mode, N=8 =
# init + 6 frames + teardown): the app emitted EXACTLY N writes — no stray
# frame ever flushed between frames — plus the renderer-level zero-idle
# invariant (identical frame → flush "") covered by the unit tests. Byte
# COUNT checks are invariant under pty delivery chunking (pure time-window
# sampling is racy on Windows: ConPTY's chunk gaps span seconds; its
# alt-screen restore also injects its own repaint bytes at teardown — those
# are platform artifacts, not app frames).
#
# Rows are pinned from the actual rendering (grid row dumps); the bullet slot
# is engine-resolved (DisplayLine.glyph) — tool headers read "◆ Run …" once.
# wait-screen (not assert-screen): pty byte delivery lags the fs marker —
# frame asserts poll the virtual terminal until the frame's rows land
# (bounded; stale screens cannot match — every wait pairs rows that differ
# from the previous frame).
name: case-011-live-streaming-agent-turn
host: test/harness/host-011.ts
size: [46, 24]
steps:
  # frame-1: user "hello"
  - await-marker: { name: frame-1 }
  - wait-screen:
      region: { startRow: 1 }
      rows:
        - "  ⎇  ~/workspace"
        - "  ┃   ❯ hello"
  # frame-2: runtime-context system line
  - await-marker: { name: frame-2 }
  - wait-screen:
      region: { startRow: 1 }
      rows:
        - "  ⎇  ~/workspace"
        - "  ┃   ❯ hello"
        - "  ┃   context: workspace i-harness-main"
  # frame-3: tool running (turn row appears)
  - await-marker: { name: frame-3 }
  - wait-screen:
      region: { startRow: 1 }
      rows:
        - "  ⎇  ~/workspace"
        - "  ┃   ❯ hello"
        - "  ┃   context: workspace i-harness-main"
        - "  ┃  ◆ Run read data.txt"
  - wait-screen:
      region: { startRow: 13 }
      rows:
        - "  ⠼ Responding…  0:00 0s  [stop]"
  # frame-4: tool done with output (execute tools always render the excerpt)
  - await-marker: { name: frame-4 }
  - wait-screen:
      region: { startRow: 1 }
      rows:
        - "  ⎇  ~/workspace"
        - "  ┃   ❯ hello"
        - "  ┃   context: workspace i-harness-main"
        - "  ┃  ◆ Run read data.txt"
        - "  ┃   data.txt exists"
  - wait-screen:
      region: { startRow: 13 }
      rows:
        - "  ⠼ Responding…  0:00 0s  [stop]"
  - assert-glyph-integrity: {}
  # frame-5: assistant "It says hello."
  - await-marker: { name: frame-5 }
  - wait-screen:
      region: { startRow: 1 }
      rows:
        - "  ⎇  ~/workspace"
        - "  ┃   ❯ hello"
        - "  ┃   context: workspace i-harness-main"
        - "  ┃  ◆ Run read data.txt"
        - "  ┃   data.txt exists"
        - "  ┃   It says hello."
  - wait-screen:
      region: { startRow: 13 }
      rows:
        - "  ⠼ Responding…  0:00 0s  [stop]"
  # frame-6: turn end — turn row hides; final full-chrome check
  - await-marker: { name: frame-6 }
  - wait-screen:
      region: { startRow: 1 }
      rows:
        - "  ⎇  ~/workspace"
        - "  ┃   ❯ hello"
        - "  ┃   context: workspace i-harness-main"
        - "  ┃  ◆ Run read data.txt"
        - "  ┃   data.txt exists"
        - "  ┃   It says hello."
  - wait-screen:
      region: { startRow: 13 }
      rows:
        - ""
  - wait-screen:
      region: { startRow: 15 }
      rows:
        - " ┃╭───────────────────────────────untitled─╮"
        - " ┃│❯ Build anything                        │"
        - " ┃│                                        │"
        - " ┃│                                        │"
        - " ┃│                                        │"
        - " ┃╰ mock-model─────────────────────────────╯"
        - ""
        - "  Enter: submit  │  Ctrl+Enter: interject  │"
  - assert-glyph-integrity: {}
  # teardown ran (marker after the teardown bytes) → exit 0 is meaningful
  - await-marker: { name: teardown-wrote }
  - assert-byte-budget: { writes: 8 }
  - wait-exit: { code: 0 }
