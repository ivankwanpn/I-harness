# M49 Task 10: case-026 — TYPED TOOL BLOCKS (real fs tools + real shell).
# The host-026 pipeline: REAL embedded service + scripted model through the
# REAL fs tools (read / edit / apply_patch) + the resolved shell (sleep 1s —
# the running window is the deterministic running→done proof), driven at
# real-pty level through the production key path.
#
# Determinism: the host writes engine-state markers (bash-running / bash-done
# / settle) — the fs/shell latency never races the asserts; the running window
# holds ≥900ms (the bash sleeps 1s), so the row polls land inside it.
name: case-026-typed-tool-blocks
host: test/harness/host-026.ts
size: [100, 30]
steps:
  - await-marker: { name: scene-026-ready }
  # ── submit the turn through the real key path (typed prompt + Enter).
  - write-pty: { data: "case 026" }
  - write-pty: { data: "\r" }
  - await-marker: { name: bash-running, timeoutMs: 40000 }
  # ── RUNNING frame: the typed Run header is up and the result is not yet
  # (the bash sleeps 1s — the frame polls land inside the window).
  - wait-screen:
      region: { startRow: 14 }
      rows:
        - "  ┃  ◆ Run sleep 1; echo resolved-shell"
      timeoutMs: 6000
  - await-marker: { name: settle, timeoutMs: 40000 }
  - await-quiescent: { ms: 300 }
  # ── the SETTLED frame (follow view): typed headers, the structured change's
  # delta, the expanded hunk lines (+ALPHA/-BETA/+GAMMA) + the bash result
  # JSON with the running→done update in place. The follow window starts one
  # row above the edit's hunk (-alpha scrolled above the fold — the engine
  # test pins the full -old/+new pair instead).
  - wait-screen:
      region: { startRow: 2 }
      rows:
        - "  ┃   ❯ Current runtime context: none. Earlier runtime-context snapshots no longer apply."
        - "  ┃   +ALPHA"
        - "  ┃    BETA"
        - "  ┃    omega"
        - "  ┃  ◆ Edit data.txt (+1/-1)"
        - "  ┃   --- a/data.txt"
        - "  ┃   +++ b/data.txt"
        - "  ┃   @@ -1,3 +1,3 @@"
        - "  ┃    ALPHA"
        - "  ┃   -BETA"
        - "  ┃   +GAMMA"
        - "  ┃    omega"
        - "  ┃  ◆ Run sleep 1; echo resolved-shell"
        - "  ┃   {"
        - "  ┃     \"stdout\": \"resolved-shell\\n\","
        - "  ┃     \"stderr\": \"\","
        - "  ┃     \"exitCode\": 0"
        - "  ┃   }"
        - "  ┃   done"
      timeoutMs: 6000
  - assert-glyph-integrity: {}
  - assert-file: { name: ws-final } # the REAL fs edits landed (ALPHA + GAMMA)
  # ── the raw viewer: focus the scrollback, open the block under the visible
  # top (the edit block — follow anchor) with Enter → the typed presentation's
  # fullscreen modal owns input.
  - write-pty: { data: "\t" }
  - write-pty: { data: "\r" }
  - await-quiescent: { ms: 200 }
  - assert-cell-colors:
      cells:
        - { row: 0, col: 1, text: "Block Edit data.txt" }
        - { row: 1, col: 5, text: "Edit data.txt" }
        - { row: 2, col: 5, text: "--- a/data.txt" }
      timeoutMs: 5000
  # ── raw toggle (r) — the REDACTED JSON payload replaces the rendered rows.
  - write-pty: { data: "r" }
  - await-quiescent: { ms: 200 }
  - assert-cell-colors:
      cells:
        - { row: 1, col: 5, text: "{" }
        - { row: 2, col: 7, text: '"args": {' }
        - { row: 3, col: 9, text: '"path": "data' }
      timeoutMs: 5000
  # ── search in the raw view: / type alpha Enter → the footer shows the count.
  - write-pty: { data: "/" }
  - write-pty: { data: "alpha" }
  - write-pty: { data: "\r" }
  - await-quiescent: { ms: 200 }
  - assert-cell-colors:
      cells:
        - { row: 29, col: 2, text: "1/4 matches" }
      timeoutMs: 5000
  # ── copy through the injected adapter: y → the recorder clipboard gets the
  # raw view text (the redacted payload — NEVER the secret value).
  - write-pty: { data: "y" }
  - await-marker: { name: copied }
  - assert-file: { name: clipboard.json, contains: '"path": "data.txt"' }
  # ── close (Esc — the modal returns input) and exit.
  - write-pty: { data: "\x1b" }
  - await-quiescent: { ms: 200 }
  - wait-screen:
      region: { startRow: 6 }
      rows:
        - "  ┃  ◆ Edit data.txt (+1/-1)"
      timeoutMs: 5000
  - request-marker: { name: request-exit }
  - await-marker: { name: teardown-wrote }
  - wait-exit: { code: 0 }
