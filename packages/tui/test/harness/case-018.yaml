# M40 G2 (C11): case-018 — MOUSE WHEEL scrolls the scrollback at REAL-PTY
# level. The host (host-018.ts, scene "018") drives the REAL app pipeline
# (host-016 parity) + host-017's real stdin input path: the test writes SGR
# 1006 wheel sequences to the pty master and the PRODUCTION InputParser →
# onInput(mouse) → scroll-up/down chain scrolls (follow-aware, ±3).
#
# Scene: 27 scrollback lines (user seed + 25-row assistant block + turn/end +
# user tail) in a 13-row scrollback region (46x24) — at follow the top is
# row-15 (row-01..row-14 are offscreen above). Wheel-UP once: offset 4-3=1 →
# top = row-1 (previously OFFSCREEN rows scroll into view, full 13-row
# window). Wheel-DOWN once: offset 1+3=4 → top = row-4.
# Byte budget writes: 8 = init(1) + 4 event frames + 2 wheel frames +
# teardown(1) (frozen clock → anim-pump repaints zero-byte).
name: case-018-mouse-wheel-scroll
host: test/harness/host-018.ts
size: [46, 24]
steps:
  # W1 user seed · W2 assistant 25 rows · W3 turn end · W4 user tail —
  # the settled follow view: rows 2..13 = row-15..row-25 + ❯ tail marker.
  - await-marker: { name: frame-4 }
  - await-quiescent: { ms: 300 }
  - wait-screen:
      region: { startRow: 2 }
      rows:
        - "  ┃   row-15"
        - "  ┃   row-16"
        - "  ┃   row-17"
        - "  ┃   row-18"
        - "  ┃   row-19"
        - "  ┃   row-20"
        - "  ┃   row-21"
        - "  ┃   row-22"
        - "  ┃   row-23"
        - "  ┃   row-24"
        - "  ┃   row-25"
        - "  ┃   ❯ tail marker"
        - ""
  # wheel-UP: SGR 1006 `<64;x;yM` (button 64 = wheel-up) — the viewport moves
  # 3 rows up from the follow clamp (offset 4 → 1): the top row flips from
  # row-15 to row-1 — rows that were offscreen now fill the window.
  # (x/y are unused by the app — no hit-testing in this wheel.)
  - write-pty:
      data: "\x1b[<64;5;5M"
  - wait-screen:
      region: { startRow: 2 }
      rows:
        - "  ┃   row-01"
        - "  ┃   row-02"
        - "  ┃   row-03"
        - "  ┃   row-04"
        - "  ┃   row-05"
        - "  ┃   row-06"
        - "  ┃   row-07"
        - "  ┃   row-08"
        - "  ┃   row-09"
        - "  ┃   row-10"
        - "  ┃   row-11"
        - "  ┃   row-12"
        - "  ┃   row-13"
  # wheel-DOWN: SGR 1006 `<65;x;yM` (button 65 = wheel-down) — offset back to
  # 4: top = row-4.
  - write-pty:
      data: "\x1b[<65;8;8M"
  - wait-screen:
      region: { startRow: 2 }
      rows:
        - "  ┃   row-04"
        - "  ┃   row-05"
        - "  ┃   row-06"
        - "  ┃   row-07"
        - "  ┃   row-08"
        - "  ┃   row-09"
        - "  ┃   row-10"
        - "  ┃   row-11"
        - "  ┃   row-12"
        - "  ┃   row-13"
        - "  ┃   row-14"
        - "  ┃   row-15"
        - "  ┃   row-16"
  - assert-glyph-integrity: {}
  - request-marker: { name: request-exit }
  - await-marker: { name: teardown-wrote }
  # byte budget: EXACTLY 8 writes (init 1 + 4 event frames + 2 wheel frames +
  # teardown 1) — one repaint per wheel event; the frozen-clock anim pump
  # contributed nothing (zero-byte idle).
  - assert-byte-budget: { writes: 8 }
  - wait-exit: { code: 0 }
