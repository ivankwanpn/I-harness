# M40 G2 (C11) wheel-close, RE-CALIBRATED BY M46b G1: case-018 — MOUSE WHEEL
# scrolls the scrollback at REAL-PTY level through the PRODUCTION path
# (InputParser → loop.onInput → the grok SCROLL STREAM — the M40 ±3 fallback
# is superseded by the stream normalization: host-018's WindowsTerminal brand
# has ept=3, so ONE SGR event = ONE line (1/3 of the 3-line notch; the notch
# materializes when the terminal's real 3-event burst arrives within 12ms).
#
# The host (host-018.ts, scene "018") drives the REAL app pipeline (host-016
# parity) + host-017's real stdin input path: the test writes SGR 1006 wheel
# sequences to the pty master and the PRODUCTION InputParser → onInput(mouse)
# → stream push → follow-aware apply (+1 line per event).
#
# Scene: 27 scrollback lines (user seed + 25-row assistant block + turn/end +
# user tail) in a 13-row scrollback region (46x24) — at follow the top is
# row-15 (row-01..row-14 are offscreen above). Wheel-UP once: stream -1 →
# offset 4-1=3 → top = line-3 (row-03). Wheel-DOWN once: offset 3+1=4 →
# top = line-4 (row-04).
# Byte budget writes: 8 = init(1) + 4 event frames + 2 wheel frames +
# teardown(1) (frozen clock → anim-pump repaints zero-byte; the stream's
# push→flush path is per-event, so each wheel event costs exactly one frame).
name: case-018-mouse-wheel-scroll
host: test/harness/host-018.ts
size: [46, 24]
steps:
  # W1 user seed · W2 assistant 25 rows · W3 turn end · W4 user tail —
  # the settled follow view: rows 2..13 = row-15..row-25 + ❯ tail marker.
  - await-marker: { name: frame-4 }
  - await-quiescent: { ms: 300 }
  - wait-screen:
      region: { startRow: 2 }
      rows:
        - "  ┃   row-15"
        - "  ┃   row-16"
        - "  ┃   row-17"
        - "  ┃   row-18"
        - "  ┃   row-19"
        - "  ┃   row-20"
        - "  ┃   row-21"
        - "  ┃   row-22"
        - "  ┃   row-23"
        - "  ┃   row-24"
        - "  ┃   row-25"
        - "  ┃   ❯ tail marker"
        - ""
  # wheel-UP: SGR 1006 `<64;x;yM` (button 64 = wheel-up) — the stream prices
  # ONE line (ept=3: 1 event = 1/3 notch): offset 4 → 3 → top line-3
  # (row-03 — rows that were offscreen below now fill the window).
  - write-pty:
      data: "\x1b[<64;5;5M"
  - wait-screen:
      region: { startRow: 2 }
      rows:
        - "  ┃   row-03"
        - "  ┃   row-04"
        - "  ┃   row-05"
        - "  ┃   row-06"
        - "  ┃   row-07"
        - "  ┃   row-08"
        - "  ┃   row-09"
        - "  ┃   row-10"
        - "  ┃   row-11"
        - "  ┃   row-12"
        - "  ┃   row-13"
        - "  ┃   row-14"
        - "  ┃   row-15"
  # wheel-DOWN: SGR 1006 `<65;x;yM` (button 65 = wheel-down) — offset 3+1=4:
  # top = line-4 (row-04).
  - write-pty:
      data: "\x1b[<65;8;8M"
  - wait-screen:
      region: { startRow: 2 }
      rows:
        - "  ┃   row-04"
        - "  ┃   row-05"
        - "  ┃   row-06"
        - "  ┃   row-07"
        - "  ┃   row-08"
        - "  ┃   row-09"
        - "  ┃   row-10"
        - "  ┃   row-11"
        - "  ┃   row-12"
        - "  ┃   row-13"
        - "  ┃   row-14"
        - "  ┃   row-15"
        - "  ┃   row-16"
  - assert-glyph-integrity: {}
  - request-marker: { name: request-exit }
  - await-marker: { name: teardown-wrote }
  # byte budget: EXACTLY 8 writes (init 1 + 4 event frames + 2 wheel frames +
  # teardown 1) — one repaint per wheel event (stream push→flush); the
  # frozen-clock anim pump contributes nothing (zero-byte idle).
  - assert-byte-budget: { writes: 8 }
  - wait-exit: { code: 0 }
