# M37a G4: case-014 — resize DURING a streaming turn across a REAL pty.
#
# The host (host-011.ts, scene "014") streams: user, system (short line —
# see host-011.ts header: long lines are wrap-truncated at the drawer clip),
# tool running, tool done, turn end — then, inside a 1200ms idle window,
# the host re-grids its renderer + re-wraps its engine at 34x18 (argv[5])
# BEFORE the assistant event's full-paint frame (resize full-paint flag) —
# two more frames. The turn is IDLE across the resize window so the 30fps
# anim pump cannot paint a stray half-size frame mid-window.
#
# The test resizes the PTY at ~350ms into the host's 1200ms window; the
# host's own internal resize at 600ms; the assistant frame lands at 1200ms.
# Assertions: no broken glyphs after the resize, row widths == cols per row,
# the final screen contains the expected texts, zero-byte idle in the
# windows, exit 0. wait-screen: pty byte delivery lags the fs marker — the
# frame asserts poll the virtual terminal until the frame's rows land.

name: case-014-resize-during-streaming
host: test/harness/host-011.ts
size: [46, 24]
steps:
  # frame-1: user "hello"
  - await-marker: { name: frame-1 }
  - wait-screen:
      region: { startRow: 1 }
      rows:
        - "  ⎇  ~/workspace"
        - "  ┃   ❯ hello"
  # frame-2: system line
  - await-marker: { name: frame-2 }
  - wait-screen:
      region: { startRow: 1 }
      rows:
        - "  ⎇  ~/workspace"
        - "  ┃   ❯ hello"
        - "  ┃   context: workspace ok"
  # frame-3: tool running — turn row on (46x24 still)
  - await-marker: { name: frame-3 }
  - wait-screen:
      region: { startRow: 1 }
      rows:
        - "  ⎇  ~/workspace"
        - "  ┃   ❯ hello"
        - "  ┃   context: workspace ok"
        - "  ┃  ◆ Run read data.txt"
  - wait-screen:
      region: { startRow: 13 }
      rows:
        - "  ⠼ Responding…  0:00 0s  [stop]"
  # frame-4: tool done with output
  - await-marker: { name: frame-4 }
  - wait-screen:
      region: { startRow: 1 }
      rows:
        - "  ⎇  ~/workspace"
        - "  ┃   ❯ hello"
        - "  ┃   context: workspace ok"
        - "  ┃  ◆ Run read data.txt"
        - "  ┃   data.txt exists"
  - wait-screen:
      region: { startRow: 13 }
      rows:
        - "  ⠼ Responding…  0:00 0s  [stop]"
  # frame-5: turn end — idle before the resize window; the host re-grids at
  # 900ms into the 1800ms sleep between frame-5 and frame-6 (ConPTY injects
  # a resize REPLAY into the pty — the test's resize step absorbs it)
  - await-marker: { name: frame-5 }
  - wait-screen:
      region: { startRow: 1 }
      rows:
        - "  ⎇  ~/workspace"
        - "  ┃   ❯ hello"
        - "  ┃   context: workspace ok"
        - "  ┃  ◆ Run read data.txt"
        - "  ┃   data.txt exists"
  - wait-screen:
      region: { startRow: 13 }
      rows:
        - ""
  - assert-glyph-integrity: {}
  # resize BEFORE the host's 1200ms tick — the pty is at 34x18 by the time
  # frame-6 is flushed; the resize itself emits zero bytes
  - resize: { cols: 34, rows: 18 }
  # frame-6: assistant — the resize full-paint at 34x18; turn row restored.
  # timeoutMs 8000: after a ConPTY resize the console resync can delay the
  # child's next frame delivery by seconds (measured empirically) — the wait
  # budget must cover the console's pass-through jitter, not just the pipe.
  - await-marker: { name: frame-6 }
  - wait-screen:
      timeoutMs: 8000
      region: { startRow: 1 }
      rows:
        - "  ⎇  ~/workspace"
        - "  ┃   ❯ hello"
        - "  ┃   context: workspace ok"
        - "  ┃  ◆ Run read data.txt"
        - "  ┃   data.txt exists"
        - "  ┃   It says hello."
        - "  ⠼ Responding…  0:00 0s  [stop]"
        - ""
        - " ┃╭───────────────────untitled─╮"
        - " ┃│❯ Build anything            │"
        - " ┃│                            │"
        - " ┃│                            │"
        - " ┃│                            │"
        - " ┃╰ mock-model─────────────────╯"
        - ""
        - "  Enter: submit  │  Ctrl+Enter:"
        - ""
  - assert-glyph-integrity: {}
  # frame-7: turn end at 34x18 — turn row hides; integrity holds
  - await-marker: { name: frame-7 }
  - wait-screen:
      timeoutMs: 8000
      region: { startRow: 1 }
      rows:
        - "  ⎇  ~/workspace"
        - "  ┃   ❯ hello"
        - "  ┃   context: workspace ok"
        - "  ┃  ◆ Run read data.txt"
        - "  ┃   data.txt exists"
        - "  ┃   It says hello."
        - ""
  - assert-glyph-integrity: {}
  - await-marker: { name: teardown-wrote }
  - assert-byte-budget: { writes: 9 }
  - wait-exit: { code: 0 }
