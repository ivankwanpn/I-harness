name: case-024-welcome-model-gate
host: test/harness/host-024.ts
size: [80, 24]
steps:
  - await-marker: { name: scene-ready }
  - wait-screen:
      region: { startRow: 1 }
      rows:
        - "  No model configured"
      timeoutMs: 5000
  # M49 Task 13: the Welcome menu gained the "Dashboard (local sessions)"
  # row (spec §8.3) — the hero is one row taller; the model-status line moved
  # one row down (row 16).
  - wait-screen:
      region: { startRow: 16 }
      rows:
        - "  No model configured. Open Settings > Models & Providers."
      timeoutMs: 5000
  - assert-glyph-integrity: {}
  - assert-idle-bytes: { expected: 0, windowMs: 350 }
  - write-pty: { data: "hello\r" }
  - wait-screen:
      region: { startRow: 3 }
      rows:
        - "  ┃ Models & Providers"
      timeoutMs: 5000
  - assert-cell-colors:
      cells:
        - { row: 12, col: 1, text: " " }
        - { row: 12, col: 2, text: "┃" }
      timeoutMs: 3000
  - assert-glyph-integrity: {}
  - assert-idle-bytes: { expected: 0, windowMs: 350 }
  - request-marker: { name: request-exit }
  - await-marker: { name: teardown-wrote }
  - assert-byte-budget: { writes: 12 }
  - wait-exit: { code: 0 }
