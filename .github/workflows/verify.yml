name: verify

# The repo shipped v0.1.13 with `pnpm typecheck` and the reachability gate red
# because nothing ever ran them. This workflow is the missing trigger.
on:
  push:
    branches: [main, "experiment/**", "codex/**"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * *"

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: typecheck (all packages)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify:test-runner
      # --no-bail on purpose: the fail-fast prefix hides every package after the
      # first failure, which is exactly how four broken packages shipped.
      - run: pnpm typecheck
      # 147 imports already reach into another package's src/ by relative path.
      # They are baselined; this step fails only when the number grows.
      - run: node scripts/audit/check-package-boundaries.mjs --gate

  compiled-gateway:
    name: compiled gateway and Windows ACL
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify:gateway

  full-suite:
    name: Windows suite (${{ matrix.suite }})
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: windows-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        suite: [gateway, executor, context-output, workspace]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/verify-all.mjs --suite "${{ matrix.suite }}"

  full-integration:
    name: Windows e2e and reachability
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/verify-all.mjs --integration

  full:
    name: verify:all
    if: always() && (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
    needs: [typecheck, compiled-gateway, full-suite, full-integration]
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Check complete Windows verification
        env:
          TYPES: ${{ needs.typecheck.result }}
          GATEWAY: ${{ needs['compiled-gateway'].result }}
          SUITES: ${{ needs['full-suite'].result }}
          INTEGRATION: ${{ needs['full-integration'].result }}
        run: |
          $results = @($env:TYPES, $env:GATEWAY, $env:SUITES, $env:INTEGRATION)
          if ($results.Where({ $_ -ne 'success' }).Count -ne 0) {
            throw "Verification incomplete for $env:GITHUB_SHA ($($results -join ', '))"
          }
          Write-Output "Verified $env:GITHUB_SHA"
